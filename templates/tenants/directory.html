{% extends "layouts/base.html" %}
{% block content %}
<div class="page-head">
  <h1>Tenant directory</h1>
  <a class="btn btn-primary" href="/admin/tenants/new">New tenant</a>
</div>
<form class="filters" method="get" action="/admin/tenants" hx-get="/admin/tenants" hx-target="#tenant-rows" hx-trigger="input changed delay:300ms from:#q, change from:select" hx-push-url="true">
  <label for="q">Search</label>
  <input id="q" name="q" type="search" placeholder="Tenant code, organisation or legal name" value="{{ q }}" maxlength="120">
  <label for="status">Status</label>
  <select id="status" name="status">
    <option value="">All statuses</option>
    {% for s in statuses %}<option value="{{ s }}" {% if *s == status.as_str() %}selected{% endif %}>{{ s }}</option>{% endfor %}
  </select>
  <label for="region">Data region</label>
  <select id="region" name="region">
    <option value="">All regions</option>
    {% for r in regions %}<option value="{{ r }}" {% if *r == region.as_str() %}selected{% endif %}>{{ r }}</option>{% endfor %}
  </select>
  <button class="btn" type="submit">Filter</button>
</form>
<div id="tenant-rows">
{% include "tenants/_rows.html" %}
</div>
{% endblock %}
