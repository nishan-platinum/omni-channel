# Bake-off gateway load balancer (docker compose --profile gateway): round-robin over two nodes,
# NO sticky sessions — any node serves any customer or agent (state lives in PostgreSQL, fan-out
# goes through the Redis event stream). Health checks use the shared bearer token (contract: every
# request carries it) and take a node out as soon as /healthz stops answering 200 (startup, drain).
global
    maxconn 400000
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 75s
    timeout server 75s
    # WebSocket sessions: heartbeat is 60 s, keep tunnels open well past that
    timeout tunnel 3600s
    timeout http-request 10s
    retries 2
    option redispatch
    retry-on conn-failure empty-response 503

frontend gateway
    bind :8088
    maxconn 400000
    default_backend nodes

backend nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz hdr Authorization "Bearer ${GATEWAY_TOKEN}"
    http-check expect status 200
    # A killed node refuses connections at once (3 fast failures); a 1–2 s pause of a healthy node
    # (GC-free here, but disk/VM stalls happen) must not take both nodes out.
    timeout check 2s
    default-server inter 1s fall 3 rise 2 maxconn 200000 on-marked-down shutdown-sessions
    server gw1 gw1:4000 check
    server gw2 gw2:4000 check
