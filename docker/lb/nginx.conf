# Load balancer for the two-node hub cluster (docker compose --profile cluster).
# Plain round-robin: sessions are NOT sticky — any node can serve any agent or customer, because
# routing state lives in PostgreSQL and real-time fan-out goes through Redis (ADR-0011).
worker_processes auto;
events { worker_connections 65536; }
http {
  upstream hub {
    server app1:3000 max_fails=1 fail_timeout=2s;
    server app2:3000 max_fails=1 fail_timeout=2s;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    location / {
      proxy_pass http://hub;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
