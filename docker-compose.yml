# Local runtime for the M01 + M10 hub Rust prototype:
#   cp .env.example .env && docker compose up --build   →  http://localhost:3000
# Two hub nodes behind one load balancer (gateway multi-node tests):
#   docker compose --profile cluster up --build -d       →  http://localhost:8080
name: omni-m01

services:
  central-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: omni_control
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?set CRM_APP_PASSWORD in .env}
    volumes:
      - central-db-data:/var/lib/postgresql/data
      - ./docker/central-db/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d omni_control"]
      interval: 3s
      timeout: 3s
      retries: 30

  tenant-pg:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tenant_admin
      POSTGRES_PASSWORD: ${TENANT_DB_PG_ADMIN_PASSWORD:?set TENANT_DB_PG_ADMIN_PASSWORD in .env}
    volumes:
      - tenant-pg-data:/var/lib/postgresql/data
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  tenant-mysql:
    image: mysql:8.4
    command: ["mysqld", "--max-connections=500"]
    environment:
      MYSQL_ROOT_PASSWORD: ${TENANT_DB_MYSQL_ADMIN_PASSWORD:?set TENANT_DB_MYSQL_ADMIN_PASSWORD in .env}
    volumes:
      - tenant-mysql-data:/var/lib/mysql
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Real-time bus of the M10 hub (cross-node fan-out, FR-ARC-003). Holds no durable data.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Imitation of Meta's WhatsApp Cloud API (NOT WhatsApp) — used when WHATSAPP_PROVIDER=fake.
  # Receives the hub's Graph API calls and posts signed webhooks back; generates bulk traffic.
  fake-meta:
    image: omni-m01-app:local
    command: ["fake_meta"]
    environment:
      FAKE_META_BIND: 0.0.0.0:8090
      FAKE_META_WEBHOOK_URL: ${FAKE_META_WEBHOOK_URL:-http://app:3000/v1/hub/channels/whatsapp/webhook}
      FAKE_META_ACCESS_TOKEN: ${FAKE_META_ACCESS_TOKEN:-fake-meta-dev-token}
      FAKE_META_APP_SECRET: ${FAKE_META_APP_SECRET:-fake-meta-dev-app-secret}
      FAKE_META_RATE_PER_SEC: ${FAKE_META_RATE_PER_SEC:-80}
      FAKE_META_LATENCY_MIN_MS: ${FAKE_META_LATENCY_MIN_MS:-20}
      FAKE_META_LATENCY_MAX_MS: ${FAKE_META_LATENCY_MAX_MS:-80}
      FAKE_META_ERROR_RATE: ${FAKE_META_ERROR_RATE:-0}
      FAKE_META_DUPLICATE_RATE: ${FAKE_META_DUPLICATE_RATE:-0}
      RUST_LOG: info
    ports:
      - "58090:8090"
    restart: unless-stopped

  # Public HTTPS address for real WhatsApp (Meta must reach the webhook). Enable ONE of them with
  # COMPOSE_PROFILES in .env:  tunnel = cloudflared quick tunnel (no account; new address on every
  # restart — the hub re-registers it in Meta automatically);  tunnel-ngrok = ngrok fixed domain
  # (free account; NGROK_AUTHTOKEN + NGROK_DOMAIN).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://app:3000"]
    restart: unless-stopped
  tunnel-ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel-ngrok"]
    command: ["http", "--url=${NGROK_DOMAIN:-missing-NGROK_DOMAIN}", "app:3000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    restart: unless-stopped

  app: &app
    build: .
    image: omni-m01-app:local
    env_file: .env
    environment: &app-env
      # Container-internal addresses override the localhost values used by `cargo run`.
      APP_BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://crm_app:${CRM_APP_PASSWORD}@central-db:5432/omni_control
      MIGRATION_DATABASE_URL: postgres://crm_owner:${POSTGRES_OWNER_PASSWORD}@central-db:5432/omni_control
      TENANT_DB_TARGETS_FILE: /app/config/tenant-db-targets.toml
      REDIS_URL: redis://redis:6379
      FAKE_META_URL: http://fake-meta:8090
      TUNNEL_METRICS_URL: http://tunnel:2000
      NODE_ID: app
      DATA_DIR: /app/data
      LOG_FORMAT: json
    volumes:
      - app-data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      central-db:
        condition: service_healthy
      tenant-pg:
        condition: service_healthy
      tenant-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-meta:
        condition: service_started
    restart: unless-stopped

  # ---- profile "cluster": two hub nodes + nginx load balancer (WebSocket upgrade) on :8080 ----
  app1:
    <<: *app
    profiles: ["cluster"]
    environment:
      <<: *app-env
      NODE_ID: app1
      PUBLIC_BASE_URL: http://localhost:8080
    ports: []
  app2:
    <<: *app
    profiles: ["cluster"]
    environment:
      <<: *app-env
      NODE_ID: app2
      PUBLIC_BASE_URL: http://localhost:8080
      HUB_DEMO_SEED: "false"
    ports: []
  lb:
    image: nginx:1.27-alpine
    profiles: ["cluster"]
    volumes:
      - ./docker/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app1
      - app2

volumes:
  central-db-data:
  tenant-pg-data:
  tenant-mysql-data:
  app-data:
