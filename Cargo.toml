[package]
name = "omni-m01"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TM CPaaS Omni Channel CRM — M01 Multi-Tenancy & Tenant Management (Rust reference implementation)"
license = "UNLICENSED"
publish = false
default-run = "omni-m01"

[lib]
name = "omni_m01"
path = "src/lib.rs"

[[bin]]
name = "omni-m01"
path = "src/main.rs"

[features]
default = []

[dependencies]
# web
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "limit", "catch-panic"] }
http = "1"
askama = "0.14"

# data
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
toml = "0.8"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# security
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
subtle = "2"

# utilities
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
regex = "1"
dotenvy = "0.15"
futures = "0.3"
url = "2"
serde_urlencoded = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false

[profile.dev.package."*"]
opt-level = 1
